name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-build:
        # Run CI when:
        # - push: normal commits (not release-please's release commits)
        # - pull_request: normal PRs immediately, release-please PRs only after formatting
        if: >
            (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'chore(main): release')) ||
            (github.event_name == 'pull_request' && (!startsWith(github.head_ref, 'release-please--') || contains(github.event.head_commit.message, 'chore: sync version and format')))
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

            - name: Check Prettier formatting
              run: npm run format:check

            - name: Run tests
              run: npm test

            - name: Build (dev standalone)
              run: npm run build:dev

            - name: Build (production libraries)
              run: npm run build

            - name: Verify bundle sizes
              # 2 MiB is a real delivery limit, not a style preference: every
              # library ships to users through an `@require` URL, and the
              # userscript manager refuses a response over 2097152 bytes
              # ("Response too large (>2097152 bytes)"). A bundle past it does
              # not load at all — the script is simply broken for everyone.
              #
              # The ceiling used to be a duplication proxy that drifted upward
              # (2 -> 2.5 -> 3 -> 3.5 MiB) every time a bundle grew. That job now
              # belongs to scripts/check-bundle-sharing.mjs, which walks the real
              # import graph on every production build and fails on a shared
              # module inlined into two bundles — so this check is free to go
              # back to enforcing the limit that actually exists.
              #
              # When a bundle approaches it, the fix is to split it (the sim
              # bundle is the precedent), never to raise this number.
              run: |
                  limit=2097152
                  human="2MB"
                  entrypoint_size=$(wc -c < "dist/Toolasha.user.js")
                  if [ "$entrypoint_size" -gt "$limit" ]; then
                    echo "❌ dist/Toolasha.user.js is over the $human limit ($entrypoint_size bytes)"
                    exit 1
                  fi
                  echo "✅ dist/Toolasha.user.js is under $human ($entrypoint_size bytes)"
                  for file in dist/libraries/*.js; do
                    size=$(wc -c < "$file")
                    if [ "$size" -gt "$limit" ]; then
                      echo "❌ $file is over the $human limit ($size bytes)"
                      exit 1
                    fi
                    echo "✅ $file is under $human ($size bytes)"
                  done
