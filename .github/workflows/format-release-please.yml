name: Format Release Please

on:
    pull_request:

permissions:
    contents: write
    pull-requests: write

jobs:
    format-release-notes:
        # Run on any push to a release-please PR — including bot force-pushes
        # that update the release. The "no diff → exit 0" guard in the commit
        # step prevents infinite loops if this workflow's own PAT push triggers
        # another synchronize event.
        if: startsWith(github.head_ref, 'release-please--')
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  ref: ${{ github.head_ref }}
                  token: ${{ secrets.PAT }}

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Sync version across files
              run: npm run version:sync

            # Draw the release boundary in the fork changelog while we still
            # know where it is. The fork's "## Unreleased — branch `main`"
            # heading is never rotated, so without a marker there is nothing in
            # the file to say which entries belong to which release — which is
            # what the what's-new panel needs to show a player only what changed
            # since their build. package.json on this branch is release-please's
            # bumped version, the same source the release build stamps @version
            # from one step of release.yml over. Re-running is a no-op: a version
            # already marked is left alone.
            - name: Stamp the release into the changelog
              run: npm run changelog:stamp

            - name: Run formatting
              run: npm run format

            - name: Commit formatted changes
              run: |
                  if git diff --quiet; then
                    echo "No formatting changes to commit."
                    exit 0
                  fi

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add -A

                  # The pre-commit hook re-runs lint-staged over what this
                  # workflow just formatted — pure redundancy here, and its
                  # normalization can leave the staged set empty, which
                  # lint-staged treats as a hard failure ("Prevented an empty
                  # git commit") and reddens a run that had nothing to do.
                  # The formatting already happened two steps up; commit
                  # without the hook, and treat a staged set the add emptied
                  # as the no-op it is.
                  if git diff --cached --quiet; then
                    echo "Formatting normalized to no staged change — nothing to commit."
                    exit 0
                  fi
                  git commit --no-verify -m "chore: sync version and format release notes"
                  git push
